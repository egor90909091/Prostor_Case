name: prostor-mvp

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: prostor
      POSTGRES_PASSWORD: prostor
      POSTGRES_DB: prostor
    # Скрипты выполняются по алфавиту (схема -> шаблоны ТЗ -> данные -> функции),
    # но ТОЛЬКО когда docker-entrypoint-initdb.d видит ПУСТОЙ pgdata volume —
    # это одноразовый bootstrap, а не система миграций. Правки в db/init не
    # применятся сами к уже существующему volume: `docker compose down -v &&
    # docker compose up --build` пересоздаст volume и накатит схему заново
    # (все данные воспроизводимы из этих же файлов). Для точечных изменений
    # уже поднятой базы правьте её через psql вручную и переносите итоговый
    # SQL сюда, чтобы init оставался источником истины.
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prostor -d prostor"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat:
    build:
      context: ./backend
      args:
        PROJECT: Prostor.Chat
    environment:
      PGHOST: db
      PGDATABASE: prostor
      PGUSER: prostor
      PGPASSWORD: prostor
      TZ_BASE_URL: http://tz:8080
      # LLM (чат): пусто -> шаблонный "стенограф" без внешних вызовов.
      # Любой OpenAI-совместимый chat/completions endpoint; сейчас — DeepSeek.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      # Эмбеддинги: отдельный endpoint, без ключа по умолчанию (локальный Ollama
      # с bge-m3, поднятый на хосте вне docker compose). Пусто -> детерминированная
      # заглушка (hashing trick), тот же алгоритм — в etl/embed_offline.py.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      # Роутер свободного текста (tool call search_services вместо жёсткого
      # "любой текст — поиск"). false — мгновенный откат на старое поведение
      # без пересборки образа, если провайдер плохо держит tool calling.
      ENABLE_ROUTER: ${ENABLE_ROUTER:-true}
      # Пороги уверенности поиска: ниже MIN_SCORE карточки не показываются вовсе,
      # выше CONFIDENT_SCORE выдача подаётся как находка, между ними — как догадка.
      SEARCH_MIN_SCORE: ${SEARCH_MIN_SCORE:-0.20}
      SEARCH_CONFIDENT_SCORE: ${SEARCH_CONFIDENT_SCORE:-0.45}
      SEARCH_MIN_MARGIN: ${SEARCH_MIN_MARGIN:-0.08}
      SEARCH_SEMANTIC_FLOOR: ${SEARCH_SEMANTIC_FLOOR:-0.60}
    extra_hosts:
      # На Docker Desktop (Mac/Windows) host.docker.internal работает и так;
      # host-gateway нужен для Linux-хостов (CI, прод) — не мешает на Mac.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  tz:
    build:
      context: ./backend
      args:
        PROJECT: Prostor.Tz
    environment:
      PGHOST: db
      PGDATABASE: prostor
      PGUSER: prostor
      PGPASSWORD: prostor
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: prostor-tz
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8081:8080"

  web:
    build: ./frontend
    depends_on:
      - chat
      - tz
    ports:
      - "3000:80"

volumes:
  pgdata:
  miniodata:
